name: keening
description: "Keening Flutter web frontend."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.5.2
  desktop_drop: ^0.8.4
  file_selector: ^1.1.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_math_fork: ^0.7.4
  flutter_secure_storage: ^11.2.0
  go_router: ^16.1.0
  http: ^1.6.0
  intl: ^0.20.3
  pasteboard: ^0.5.0
  pdf: ^3.13.1
  web: ^1.1.0
  window_manager: ^0.5.2
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
  fonts:
    # The same Roboto on the web and the desktop app (otherwise the desktop app
    # would use Windows' own Segoe UI).
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-regular.ttf
        - asset: assets/fonts/Roboto-italic.ttf
          style: italic
        - asset: assets/fonts/Roboto-bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-bolditalic.ttf
          weight: 700
          style: italic
